# Production stack: PostgreSQL + one-off migrations + the website.
# Values come from .env next to this file (see .env.example → "Docker").
#   docker compose up -d --build
#   docker compose run --rm tools npm run admin:create -- --email you@company.sa --name "الاسم"
name: riyada

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riyada}
      POSTGRES_USER: ${POSTGRES_USER:-riyada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. The app starts only after it succeeds.
  migrate:
    build: { context: ., target: tools }
    image: riyada-tools
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &db-url
      DATABASE_URL: postgresql://${POSTGRES_USER:-riyada}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-riyada}?schema=public
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    image: riyada-web
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *db-url
      STORAGE_DIR: /app/storage
    ports:
      # Published on localhost only: put Nginx/Caddy with HTTPS in front (see docs/DEPLOYMENT.md).
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Admin CLI, seeding and backups: docker compose run --rm tools <command>
  tools:
    image: riyada-tools
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *db-url
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
