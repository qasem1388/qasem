<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل الدخول — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/admin-assets/css/admin.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-card__brand">
        <img id="brandLogo" alt="" hidden>
        <h1>تسجيل دخول لوحة التحكم</h1>
        <p class="muted small" id="brandName">نظام إدارة محتوى الجمعية</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="alert alert--error hidden" id="loginError" role="alert"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required dir="ltr" autofocus>
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="pw-field">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required dir="ltr">
            <button class="pw-toggle" type="button" id="pwToggle" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button class="btn" type="submit" id="loginBtn" style="min-height:46px"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
        <a class="small muted" href="/" style="text-align:center"><i class="fa-solid fa-arrow-right"></i> العودة إلى الموقع</a>
      </form>
    </div>
  </main>
  <script type="module" src="/admin-assets/js/login.js"></script>
</body>
</html>
