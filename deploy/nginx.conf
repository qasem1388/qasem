# Nginx reverse proxy for the website (Ubuntu/Debian: /etc/nginx/sites-available/riyada).
# Replace example.sa with your domain, then obtain certificates:
#   sudo certbot --nginx -d example.sa -d www.example.sa
# The app listens on 127.0.0.1:3000 (npm start / systemd / Docker).

upstream riyada_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.sa www.example.sa;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://example.sa$request_uri; }
}

# Redirect www to the main domain.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.example.sa;
  ssl_certificate     /etc/letsencrypt/live/example.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.sa/privkey.pem;
  return 301 https://example.sa$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.sa;

  ssl_certificate     /etc/letsencrypt/live/example.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.sa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # Largest form upload is 8 MB (quote attachment); media library images up to 5 MB.
  client_max_body_size 10m;
  client_body_timeout 30s;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Hashed build assets never change: cache them for a year.
  location /_next/static/ {
    proxy_pass http://riyada_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://riyada_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app trusts exactly one proxy hop (TRUSTED_PROXY_HOPS=1): send the real client address only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
