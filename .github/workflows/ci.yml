name: CI & Windows installers

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows installers (EXE + MSI)
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write # publish the installers as a GitHub pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # SQLCipher links a vendored OpenSSL, which is compiled from source with
      # Strawberry Perl (preinstalled on the runner) and NASM.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Direct download links on the Releases page (artifacts need a signed-in
      # GitHub session and come zipped; release assets do not).
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: حساباتي 0.1.0 — نسخة تجريبية (بناء ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            نسخة تجريبية من المرحلة الأولى — ليست للاستخدام بالبيانات المالية الفعلية بعد.

            - **Hesabati_…_x64-setup.exe**: التثبيت الموصى به (للمستخدم الحالي).
            - **Hesabati_…_x64_ar-SA.msi**: للتثبيت عبر أدوات إدارة الأجهزة.

            الملفات غير موقّعة رقميًا: عند ظهور تحذير Windows اختر «مزيد من المعلومات» ثم «تشغيل على أي حال».
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
