name: CI & Windows installers

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows installers (EXE + MSI)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # SQLCipher links a vendored OpenSSL, which is compiled from source with
      # Strawberry Perl (preinstalled on the runner) and NASM.
      - uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hesabati-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
